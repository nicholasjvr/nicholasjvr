<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Nicholas Jansen van Rensburg — Full-Stack & Mobile Product Builder">
  <defs>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334139" opacity="0.55" />
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141A16" />
      <stop offset="100%" stop-color="#1C241E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C44F32" />
      <stop offset="100%" stop-color="#E06D50" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.25); }
      }
      .pulse-dot {
        animation: pulse 2.4s ease-in-out infinite;
        transform-origin: 96px 68px;
      }
    </style>
  </defs>

  <!-- Background & Subtle Dot Grid -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#dots)" />
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#2D3830" stroke-width="1.5" />

  <!-- Top Editorial Rule -->
  <line x1="72" y1="98" x2="1128" y2="98" stroke="#2D3830" stroke-width="1" />

  <!-- Status Pill -->
  <rect x="72" y="50" width="330" height="34" rx="17" fill="#1F2822" stroke="#344239" stroke-width="1" />
  <circle class="pulse-dot" cx="96" cy="67" r="5" fill="#689D7A" />
  <text x="112" y="72" fill="#A7B4AB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.2">INDEPENDENT BUILDER · SOUTH AFRICA</text>

  <!-- Top-Right Domain Tag -->
  <text x="1128" y="72" text-anchor="end" fill="#C44F32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">nicholas.cinhaus.co.za ↗</text>

  <!-- Main Heading -->
  <text x="72" y="172" fill="#F5F5F0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2">
    Nicholas Jansen van Rensburg<tspan fill="#C44F32">.</tspan>
  </text>

  <!-- Subheadline -->
  <text x="72" y="218" fill="#A7B4AB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Building full-stack web apps, mobile experiences, and products that cross into real life.
  </text>

  <!-- Bottom Editorial Bar -->
  <rect x="72" y="260" width="96" height="4" rx="2" fill="url(#accentGrad)" />
  <text x="188" y="267" fill="#7D8B81" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.5">
    01 SPORTSOPP  ·  02 WAKATIME  ·  FULL-STACK &amp; MOBILE
  </text>
</svg>
