      <stop offset="0%" stop-color="#161D18" />
      <stop offset="100%" stop-color="#1D2620" />
    </linearGradient>
  </defs>
  <rect width="580" height="280" rx="14" fill="url(#cardBg1)" />
  <rect x="1" y="1" width="578" height="278" rx="13" fill="none" stroke="#2E3B32" stroke-width="1.5" />

  <!-- Top Row: Index + Domain -->
  <text x="32" y="46" fill="#C44F32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1">01 / CASE STUDY</text>
  <text x="548" y="46" text-anchor="end" fill="#689D7A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">sportsopp.com ↗</text>
